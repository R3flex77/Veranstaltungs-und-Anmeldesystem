services:
  mysql:
    image: mysql:8.0
    container_name: event-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - event-network

  php:
    build: ./php
    container_name: event-php
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./php/src:/var/www/html
    depends_on:
      - mysql
    networks:
      - event-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: event-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - event-network

networks:
  event-network:
    driver: bridge

volumes:
  mysql_data: